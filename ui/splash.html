<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      cursor: default;
    }

    /* Rounded dark card filling the (transparent, frameless) splash window. */
    .card {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #1B1B1A;
      border-radius: 18px;
      font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
    }

    /* Entrance: each element slides up + fades in, cubic ease-out, staggered. */
    .enter {
      opacity: 0;
      animation: slideFade 0.55s cubic-bezier(0.33, 1, 0.68, 1) forwards;
    }
    .logo-wrap { animation-delay: 0.06s; }
    .word      { animation-delay: 0.20s; }

    @keyframes slideFade {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* After the entrance, the logo hovers up/down 50px, slowly, cubic ease-in-out.
       (On an inner wrapper so it composes with the entrance translate on .logo-wrap.) */
    .logo-hover {
      animation: floaty 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes floaty {
      0%   { transform: translateY(-25px); }
      50%  { transform: translateY(25px); }
      100% { transform: translateY(-25px); }
    }

    /* The padded transparent logomark keeps the supplied artwork intact. */
    .logo {
      display: block;
      width: 150px;
      height: 150px;
      object-fit: contain;
    }

    .word {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #F5F5F4;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap enter">
      <div class="logo-hover">
        <img class="logo" src="gitterdone-logomark.png" width="150" height="150" alt="Gitterdone" draggable="false" />
      </div>
    </div>
    <div class="word enter">Gitterdone</div>
  </div>
</body>
</html>

name: Build desktop installers

# Build the macOS (.dmg, universal) and Windows (.exe) installers with Tauri on
# real runners, sign/notarize them, and generate a manifest for signed updates.
#
# - Push a version tag (e.g. v1.0.22) to build AND publish a GitHub Release with
#   the installers + updater artifacts attached.
# - Or run manually from the Actions tab (workflow_dispatch) to get downloadable
#   build artifacts without cutting a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # required to create/attach a Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Explicitly request installer bundles for the release: the committed
          # tauri.conf.json keeps targets app-only (fast local/check builds), so
          # the release asks for the .dmg / .exe here. Updater artifacts
          # (latest.json) still come from createUpdaterArtifacts in the config.
          - os: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - os: windows-latest
            args: '--bundles nsis'
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Read the Developer ID signing identity straight out of the certificate
      # that's already saved as a secret, so no separate APPLE_SIGNING_IDENTITY
      # secret has to be maintained (how the old electron-builder auto-discovery
      # worked). Imports the cert into a throwaway keychain purely to read the
      # identity name, then deletes it — tauri-action does its own import to sign.
      - name: Derive the Apple signing identity from the saved certificate
        if: runner.os == 'macOS'
        id: signid
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          umask 077
          CERT="$RUNNER_TEMP/gd-cert.p12"
          KEYCHAIN="$RUNNER_TEMP/gd-signing.keychain-db"
          cleanup() {
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$CERT"
          }
          trap cleanup EXIT
          KC_PW="$(openssl rand -base64 24)"
          printf '%s' "$CERT_B64" | openssl base64 -d -A > "$CERT"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CERT_PW" -T /usr/bin/codesign >/dev/null
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | sed -n '1p')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the MACOS_CERTIFICATE_P12_BASE64 secret."
            exit 1
          fi
          echo "Using signing identity: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build, sign, and (on a tag) publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # --- Auto-updater signing (Tauri minisign key) ---
          # Private key generated with `npm run tauri signer generate`; the matching
          # public key is baked into tauri.conf.json (plugins.updater.pubkey).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- macOS code signing + notarization (Developer ID) ---
          # Reuses the same Apple credentials the Electron build used; APPLE_CERTIFICATE*
          # are the old MACOS_CERTIFICATE_* secrets. The signing identity is read out
          # of that certificate in the step above — no separate secret to maintain.
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ steps.signid.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }} -- --locked
          # On a version tag, create/publish the release and attach the bundles +
          # updater manifest (latest.json). tauri-action notarizes and staples the
          # .app and .dmg itself, so no separate notarytool step is needed.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Gitterdone ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Keep manual build artifacts without publishing a release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*-setup.exe
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error

      # Keep the permanent "always latest" download links working. tauri-action
      # uploads versioned filenames (e.g. Gitterdone_1.0.22_universal.dmg); add
      # stable-named copies so the landing-page links never need updating:
      #   .../releases/latest/download/Gitterdone.dmg
      #   .../releases/latest/download/Gitterdone.exe
      - name: Attach stable-named installer aliases (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -e
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$DMG" "Gitterdone.dmg"
          gh release upload "$RELEASE_TAG" "Gitterdone.dmg" --clobber

      - name: Attach stable-named installer aliases (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -e
          EXE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$EXE" "Gitterdone.exe"
          gh release upload "$RELEASE_TAG" "Gitterdone.exe" --clobber

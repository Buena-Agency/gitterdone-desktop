name: Build desktop installers

# Build the macOS (.dmg, universal) and Windows (.exe) installers with Tauri on
# real runners, sign/notarize them, and generate the signed auto-updater manifest.
#
# - Push a version tag (e.g. v1.0.22) to build AND publish a GitHub Release with
#   the installers + updater artifacts attached.
# - Or run manually from the Actions tab (workflow_dispatch) to get downloadable
#   build artifacts without cutting a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # required to create/attach a Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - os: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Build, sign, and (on a tag) publish
        uses: tauri-apps/tauri-action@v0
        env:
          # --- Auto-updater signing (Tauri minisign key) ---
          # Private key generated with `npm run tauri signer generate`; the matching
          # public key is baked into tauri.conf.json (plugins.updater.pubkey).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- macOS code signing + notarization (Developer ID) ---
          # Reuses the same Apple credentials the Electron build used; APPLE_CERTIFICATE*
          # are the old MACOS_CERTIFICATE_* secrets, plus a new APPLE_SIGNING_IDENTITY.
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}
          # On a version tag, create/publish the release and attach the bundles +
          # updater manifest (latest.json). tauri-action notarizes and staples the
          # .app and .dmg itself, so no separate notarytool step is needed.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Gitterdone ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # Keep the permanent "always latest" download links working. tauri-action
      # uploads versioned filenames (e.g. Gitterdone_1.0.22_universal.dmg); add
      # stable-named copies so the landing-page links never need updating:
      #   .../releases/latest/download/Gitterdone.dmg
      #   .../releases/latest/download/Gitterdone.exe
      - name: Attach stable-named installer aliases (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$DMG" "Gitterdone.dmg"
          gh release upload "${{ github.ref_name }}" "Gitterdone.dmg" --clobber

      - name: Attach stable-named installer aliases (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          EXE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$EXE" "Gitterdone.exe"
          gh release upload "${{ github.ref_name }}" "Gitterdone.exe" --clobber
